[project]
name = "jobsearchhh-ru"
version = "0.1.0"
description = ""
authors = [
    {name = "S.Nesterovich",email = "stas.nester18@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]

[tool.poetry]
packages = [{include = "jobsearchhh"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "black (>=26.1.0,<27.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.19.1,<2.0.0)"
]
dev = [
    "requests (>=2.32.5,<3.0.0)",
    "types-requests (>=2.32.4.20260107,<3.0.0.0)",
    "pybit (>=5.13.0,<6.0.0)",
    "f (>=0.0.1,<0.0.2)"
]
test = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)"
]

[tool.black]
line-length = 119
extend-exclude = '''
/(
\.eggs # Исключить несколько общих каталогов
| \.git # в корне проекта
| \.hg
| \.mypy_cache
| \.tox
| \.venv
| dist
| build
| __pycache__
)/
'''

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'
